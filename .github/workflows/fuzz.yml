name: Fuzz

# Fuzzing for the library crates. See fuzz/README.md.
#
# - replay:       every committed corpus and regression input, through every
#                 oracle, on Linux, macOS, and Windows (stable Rust, overflow
#                 checks on). Fast and deterministic: a PR that breaks a
#                 previously found bug or an oracle fails here.
# - fuzz:         libFuzzer under AddressSanitizer, one job per target group.
#                 Each target grows a corpus that is cached across runs (saved
#                 from main and the nightly schedule), so coverage accumulates
#                 instead of restarting from the seeds every time. PRs fuzz
#                 each target for FUZZ_SECONDS_PR; the nightly run for
#                 FUZZ_SECONDS_NIGHTLY.
# - api-coverage: every public function of openjd-expr / -model / -sessions /
#                 -snapshots must be executed by the committed corpus (llvm
#                 source coverage of the replay), or be excluded with a reason
#                 in fuzz/api_coverage.toml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release, "patch_*"]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "600"

# One group per event type, so a long nightly run never queues main's push
# run (or the reverse).
concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  # Pinned so a broken nightly cannot randomly fail the job; bump deliberately
  # (and keep scripts/fuzz.sh and scripts/check_fuzz_api_coverage.py in step).
  FUZZ_TOOLCHAIN: nightly-2026-10-07
  FUZZ_SECONDS_PR: 90
  FUZZ_SECONDS_NIGHTLY: 1200

jobs:
  replay:
    name: Fuzz corpus replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Restore cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            fuzz/target
          key: fuzz-replay-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: fuzz-replay-${{ runner.os }}-
      - name: Replay corpus and regressions
        run: cargo test --manifest-path fuzz/Cargo.toml --no-default-features
      # The fuzz crate is its own workspace, so the main CI's fmt/clippy jobs
      # do not see it. `--lib --tests --examples` (not `--all-targets`): the
      # lib `#[path]`-includes CLI sources whose own cfg(test) modules need
      # the CLI's dev-dependencies.
      - name: Clippy (fuzz crate)
        if: runner.os == 'Linux'
        run: |
          rustup component add clippy
          cargo clippy --manifest-path fuzz/Cargo.toml --no-default-features --lib --tests --examples -- -D warnings
      - name: Rustfmt (fuzz crate)
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt --manifest-path fuzz/Cargo.toml --all -- --check

  fuzz:
    name: Fuzz (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # At most 5 targets per group, so the nightly run (FUZZ_SECONDS_NIGHTLY
      # per target) stays well inside timeout-minutes. tests/replay.rs checks
      # that every target is in exactly one group.
      matrix:
        include:
          - group: expr-eval
            targets: expr_eval_text expr_eval_gen expr_format_string expr_function_call
          - group: expr-values
            targets: expr_parse expr_range expr_int_range expr_type
          - group: expr-data-cli
            targets: expr_value expr_path expr_symbol_table cli_args
          - group: model
            targets: model_decode_text model_job_gen model_env_gen model_misc
          - group: sessions-snapshots
            targets: sessions_directives sessions_framer sessions_embedded_files snapshots_decode_text snapshots_ops_gen
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install rust nightly
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - name: Restore cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-0.13.2
      - name: Install cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            fuzz/target
          key: fuzz-build-${{ env.FUZZ_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: fuzz-build-${{ env.FUZZ_TOOLCHAIN }}-
      # The grown corpus: restored from the newest run on main / the schedule.
      # Saved below only from those runs, never from a PR.
      - name: Restore grown corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/work
          key: fuzz-corpus-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.group }}-
      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && env.FUZZ_SECONDS_NIGHTLY || github.event_name == 'workflow_dispatch' && inputs.seconds || env.FUZZ_SECONDS_PR }}
          # Two libFuzzer workers per target on the 4-core runner.
          FUZZ_JOBS: 2
        run: scripts/fuzz.sh run ${{ matrix.targets }}
      # Keep the cached corpus small: minimize it before saving, so it does
      # not grow without bound across runs.
      - name: Minimize grown corpus
        if: always() && github.event_name != 'pull_request'
        run: scripts/fuzz.sh cmin-work ${{ matrix.targets }}
      # The grown corpus as an artifact, to fold into fuzz/corpus with
      # `FUZZ_WORK_DIR=<download> scripts/fuzz.sh cmin`.
      - name: Upload grown corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.group }}
          path: fuzz/work
          retention-days: 14
          if-no-files-found: ignore
      - name: Save grown corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: fuzz/work
          key: fuzz-corpus-${{ matrix.group }}-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.group }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  api-coverage:
    name: Fuzz API coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install rust stable + nightly
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - name: Restore cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-0.9.1
      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: Check every public function is fuzzed
        run: python3 scripts/check_fuzz_api_coverage.py --generate
