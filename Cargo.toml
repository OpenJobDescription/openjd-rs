[workspace]
members = [
    "crates/openjd-expr",
    "crates/openjd-model",
    "crates/openjd-sessions",
    "crates/openjd-cli",
    "crates/openjd-snapshots",
    "crates/openjd-for-js",
]
resolver = "2"

# Workspace-wide metadata inherited by crates via `*.workspace = true`. Each
# publishable crate sets its own `version` (independent versioning) but inherits
# everything else from here. The non-publishable crate openjd-for-js inherits
# the workspace version below as a convenience — it has `publish = false` so
# the version number is not meaningful on npm.
[workspace.package]
version = "0.4.0"
edition = "2021"
license = "(Apache-2.0 OR MIT)"
repository = "https://github.com/OpenJobDescription/openjd-rs"
homepage = "https://github.com/OpenJobDescription/openjd-rs"
readme = "README.md"
rust-version = "1.97.0"
authors = ["Amazon Web Services"]
keywords = ["openjd", "openjobdescription", "render-farm", "job-template", "rendering"]
categories = ["command-line-utilities", "parser-implementations"]

# Lints every workspace crate opts into with `[lints] workspace = true`. CI
# runs clippy (openjd-for-js in its own job, for the host and wasm32) and
# `cargo doc` (all crates) with `-D warnings`, so a `warn` here fails the build.
#
# `missing_docs` enforces quality-criteria Q2's "every public item has a `///`
# doc comment". Items that predate the lint carry an item-level
# `allow(missing_docs, reason = "missing-docs burn-down ...")` attribute;
# documenting them and deleting that attribute is tracked debt, and new code
# must not add one.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
shlex = "2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: read every JSON number as the nearest `f64`. Without it
# serde_json's float parser can land one ULP off (1.4757395258967641e+20 reads
# as 1.475739525896764e+20), and a FLOAT written as a number must keep its
# exact value to be written as CPython's `repr` writes it.
serde_json = { version = "1", features = ["float_roundtrip"] }
ryu = "1"
serde-saphyr = "2"
thiserror = "2"
regex = "1"
regex-syntax = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
