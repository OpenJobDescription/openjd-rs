[envs.default]
# Install the in-repo openjd-model and openjd-sessions first so tests run
# against them rather than the PyPI releases. Their versions satisfy this
# package's dependency ranges.
pre-install-commands = [
  "pip install ../openjd-model ../openjd-sessions",
  "pip install -r requirements-testing.txt"
]

[envs.default.scripts]
sync = "pip install -r requirements-testing.txt"
test = "pytest --cov-config pyproject.toml {args:test}"
typing = "mypy {args:src test}"
style = [
  "ruff check {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "style",
]
lint = [
  "style",
  "typing",
]

[[envs.all.matrix]]
python = ["3.9", "3.10", "3.11", "3.12", "3.13"]
