[package]
name = "openjd-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Keep this crate out of the root workspace. cargo-fuzz builds it standalone
# with a nightly toolchain and sanitizer `-Z` flags; an empty `[workspace]`
# table makes it its own workspace root so the stable build/test/clippy/MSRV
# jobs never see it.
[workspace]

# This crate is deliberately NOT a member of the root workspace (the root
# Cargo.toml does not list `fuzz/`). cargo-fuzz builds it standalone with a
# nightly toolchain and `-Z` flags; keeping it out of the workspace avoids
# perturbing the stable build/test/clippy jobs and the MSRV check.

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.openjd-expr]
path = "../crates/openjd-expr"

[dependencies.openjd-model]
path = "../crates/openjd-model"

[dependencies.openjd-snapshots]
path = "../crates/openjd-snapshots"

# Building the fuzz targets with debug assertions AND overflow checks is the
# whole point: many of the historically-found bugs were `attempt to * with
# overflow` panics that only fire when overflow-checks are on. Keeping them on
# in the release profile (which cargo-fuzz builds) means the sanitizer build
# still traps arithmetic overflow instead of silently wrapping.
[profile.release]
debug = 1
overflow-checks = true
debug-assertions = true

[[bin]]
name = "expr_parse"
path = "fuzz_targets/expr_parse.rs"
test = false
doc = false
bench = false

