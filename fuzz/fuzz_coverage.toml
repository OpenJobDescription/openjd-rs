#
# Fuzz-coverage registry — the source of truth for scripts/check_fuzz_coverage.py.
#
# Every public function that takes untrusted input (a &str, &[u8],
# serde_json::Value, or &Path parameter) in openjd-expr / openjd-model /
# openjd-snapshots MUST appear here exactly once, either:
#
#   [[fuzzed]]         — reached by a fuzz target (name it), or
#   [[not_untrusted]]  — takes such a parameter but the value is NOT untrusted
#                        input at the trust boundary (explain why).
#
# The check enforces that the set of classified functions equals the set of
# input-shaped public functions in the source — so adding a new such function
# fails CI until it is triaged here (the ratchet), and renaming/removing one
# fails until its entry is updated (no dangling claims).
#
# `fn` keys are "<repo-relative-file>::<fn_name>". When two entries would share
# a key (an overloaded name across impls in one file, e.g. several `new` or
# `check_constraints`), the check treats the file+name as covered once — a
# single classification applies to every same-named public fn in that file,
# which is the intended granularity here.

# ─── Fuzz targets ────────────────────────────────────────────────────────────
# Each key must match a fuzz/fuzz_targets/<name>.rs file. The description is for
# humans; the check only verifies the name ↔ file correspondence.
[targets]
expr_parse = "openjd_expr::ParsedExpression::new / with_profile (parser)"
expr_evaluate = "parse + evaluate under both POSIX and Windows path formats"
range_expr = "RangeExpr::from_str + len/get/iter"
int_range_new = "IntRange::new with arbitrary i64 triples"
range_expr_slice = "RangeExpr::slice with arbitrary i64 indices"
expr_type_parse = "ExprType::parse (type-string parser)"
format_string = "FormatString::new + resolve_string_with"
copy_symbol_value = "copy_symbol_value dotted-name walk"
model_decode = "document_string_to_object + decode_{job,environment,}_template"
model_create_job = "preprocess_job_parameters + create_job (instantiation)"
snapshot_decode = "decode_manifest + Manifest::validate"
snapshot_ops = "diff/compose/partition/subtree/filter over decoded manifests"

