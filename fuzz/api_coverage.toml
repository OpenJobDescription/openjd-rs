#
# Public functions the fuzz corpus deliberately does not execute.
# Checked by scripts/check_fuzz_api_coverage.py: every other public free
# function and inherent method of openjd-expr / -model / -sessions /
# -snapshots must be executed when the committed corpus is replayed.
#
# Keys are fnmatch patterns over `crate::module::Type::method` paths. Every
# pattern must match at least one public function, and an exact (non-glob)
# entry for a function the corpus does execute fails as stale.

[exclude]
# --- openjd-sessions: process, filesystem, and logging side effects -------
"openjd_sessions::Session::with_config" = "creates the session working directory and spawns the cross-user helper; covered by tests/test_session.rs"
"openjd_sessions::Session::enter_environment*" = "runs an onEnter subprocess; covered by session integration tests"
"openjd_sessions::Session::exit_environment" = "runs an onExit subprocess; covered by session integration tests"
"openjd_sessions::Session::run_task" = "runs an onRun subprocess; covered by session integration tests"
"openjd_sessions::Session::run_subprocess" = "spawns a process; covered by session integration tests"
"openjd_sessions::Session::cancel_action" = "signals a running subprocess"
"openjd_sessions::Session::cancel_handle" = "signals a running subprocess"
"openjd_sessions::SessionCancelHandle::*" = "signals a running subprocess"
"openjd_sessions::Session::cleanup" = "deletes the working directory"
"openjd_sessions::Session::clone_cancel_writer" = "duplicates a cross-user helper file descriptor"
"openjd_sessions::Session::override_action_state" = "worker-agent bookkeeping on a running action; no input"
"openjd_sessions::runner::*" = "script runners spawn subprocesses; their resolution logic is reached through model_job_gen's run-time resolution"
"openjd_sessions::tempdir::*" = "creates and inspects real directories"
"openjd_sessions::TempDir::*" = "creates and deletes real directories"
"openjd_sessions::logging::*" = "log emission only; no input parsing"
"openjd_sessions::LogContent::*" = "bitflags constants and helpers; no input"
"openjd_sessions::embedded_files::write_embedded_file*" = "writes files; the path validation in front of it is fuzzed by sessions_embedded_files"
"openjd_sessions::embedded_files::chown_for_user" = "changes file ownership"
"openjd_sessions::embedded_files::EmbeddedFiles::write_file_contents" = "writes files; data resolution is fuzzed through model_job_gen"
# --- openjd-snapshots: filesystem, SQLite, and S3 ---------------------------
"openjd_snapshots::S3DataCache::*" = "AWS S3 client; covered by the #[ignore]d S3 integration tests"
"openjd_snapshots::S3CheckCache::*" = "SQLite file cache"
"openjd_snapshots::HashCache::*" = "SQLite file cache"
"openjd_snapshots::FileSystemDataCache::*" = "filesystem object store"
"openjd_snapshots::data_cache::*" = "object-store plumbing (filesystem / S3)"
"openjd_snapshots::collect_abs_snapshot" = "walks the real filesystem"
"openjd_snapshots::hash_abs_*" = "reads and hashes real files"
"openjd_snapshots::hash::hash_file*" = "reads real files"
"openjd_snapshots::hash_upload_abs_manifest" = "reads files and uploads to an object store"
"openjd_snapshots::download_abs_manifest" = "downloads from an object store and writes files"
"openjd_snapshots::cache_sync_manifest" = "copies between object stores"
# --- unreachable through the public API ------------------------------------
"openjd_expr::ExprProfile::has_extension" = "ExprExtension has no variants yet, so no argument can be constructed"
"openjd_expr::functions::conversion::int_from_bool" = "not registered in the default library (dead public helper)"
"openjd_expr::functions::misc::path_join_fn" = "not registered in the default library (dead public helper)"
"openjd_expr::functions::path_parse::extension_no_dot" = "not registered in the default library (dead public helper)"
