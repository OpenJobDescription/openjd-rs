# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    # Build-only dependency of `stacker` (via rustpython-ruff_python_parser
    # 0.16+): ar_archive_writer. The LLVM exception only relaxes Apache-2.0's
    # §4 notice requirements for binary redistribution; it is used by rustc
    # itself and is strictly more permissive than plain Apache-2.0.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[bans]
# Duplicate versions are common in large transitive graphs. The AWS SDK
# stack and the `s3s`/`s3s-aws` dev-dependencies bring in two copies of
# crates like http, windows-sys, sha2, digest, and rand. These are forced
# by upstream and not actionable by us, so suppress the noise.
multiple-versions = "allow"

[advisories]
version = 2
ignore = [
    # crypto-bigint 0.5.5: timing side channels in operations intended to be
    # constant-time. The only fix is crypto-bigint >= 0.7.6, with no patched
    # 0.5.x release. 0.5.5 comes in only through aws-sigv4 (1.6.3, the latest
    # as of 2026-10-26) and its `sigv4a` feature (SigV4a signing, e.g. for S3
    # Multi-Region Access Points), which openjd-snapshots enables on
    # aws-sdk-s3/aws-sdk-sts.
    # Exploiting it requires observing timing on the signing client. Remove
    # this ignore once aws-sigv4 depends on crypto-bigint >= 0.7.6.
    { id = "RUSTSEC-2026-0387", reason = "no patched crypto-bigint 0.5.x; pulled in by aws-sigv4 sigv4a, awaiting upstream smithy-rs upgrade" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
