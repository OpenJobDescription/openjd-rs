specificationVersion: jobtemplate-2023-09
name: ShotRender
parameterDefinitions:
  - {name: Frames, type: STRING, default: "1-10"}
  - {name: Scene, type: STRING, default: shot010.blend}
jobEnvironments:
  - name: Conda
    variables:
      CONDA_PACKAGES: blender
      PYTHONUNBUFFERED: "1"
steps:
  - name: Prep
    script:
      actions:
        onRun: {command: prep.sh, args: ["{{Param.Scene}}"]}
  - name: Render
    dependencies: [{dependsOn: Prep}]
    parameterSpace:
      taskParameterDefinitions:
        - {name: Frame, type: INT, range: "{{Param.Frames}}"}
    script:
      actions:
        onRun: {command: blender, args: ["-b", "{{Param.Scene}}", "-f", "{{Task.Param.Frame}}"]}
  - name: Encode
    dependencies: [{dependsOn: Render}]
    script:
      actions:
        onRun: {command: ffmpeg, args: ["-i", "frames/%04d.png", "out.mp4"]}
  - name: Cleanup
    dependencies: [{dependsOn: Encode}]
    script:
      actions:
        onRun: {command: rm, args: ["-rf", "scratch"]}
