# The new side of a template edit: the right eye is added.
specificationVersion: jobtemplate-2023-09
name: Shot010
parameterDefinitions:
  - {name: Frames, type: STRING, default: "1-3"}
steps:
  - name: Render
    parameterSpace:
      taskParameterDefinitions:
        - {name: Frame, type: INT, range: "{{Param.Frames}}"}
        - {name: Eye, type: STRING, range: [left, right]}
    script:
      actions:
        onRun:
          command: render
          args: ["--frame", "{{Task.Param.Frame}}", "--eye", "{{Task.Param.Eye}}"]
