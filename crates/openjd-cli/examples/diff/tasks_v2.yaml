# The new side: Render gains an Eye task parameter; Composite changes a let nothing reads.
specificationVersion: jobtemplate-2023-09
extensions: [EXPR]
name: Shot010
steps:
  - name: Render
    parameterSpace:
      taskParameterDefinitions:
        - {name: Frame, type: INT, range: "1-3"}
        - {name: Eye, type: STRING, range: [left, right]}
    script:
      actions:
        onRun: {command: render, args: ["--frame", "{{Task.Param.Frame}}"]}
  - name: Composite
    let: ["fps = 30"]
    script:
      actions:
        onRun: {command: composite}
