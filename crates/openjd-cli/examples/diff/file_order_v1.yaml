# `openjd diff` example (embedded file order): old side, against file_order_v2.yaml.
specificationVersion: jobtemplate-2023-09
name: Demo
steps:
  - name: Render
    script:
      actions: {onRun: {command: bash, args: ["{{Task.File.Run}}", "{{Task.File.Config}}"]}}
      embeddedFiles:
        - {name: Run, type: TEXT, data: render}
        - {name: Config, type: TEXT, data: "quality=high"}
