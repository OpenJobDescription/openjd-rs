# `openjd diff` example (host requirement order): old side, against host_order_v2.yaml.
specificationVersion: jobtemplate-2023-09
name: Demo
steps:
  - name: Render
    hostRequirements:
      amounts:
        - {name: amount.worker.vcpu, min: 4}
        - {name: amount.worker.memory, min: 8192}
      attributes:
        - {name: attr.worker.os.family, anyOf: [linux]}
        - {name: attr.worker.cpu.arch, anyOf: [x86_64]}
    script: {actions: {onRun: {command: render}}}
