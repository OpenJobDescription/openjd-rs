# `openjd diff` example (action cancelation): new side, against cancelation_v1.yaml.
specificationVersion: jobtemplate-2023-09
extensions: [FEATURE_BUNDLE_1]
name: Demo
steps:
  - name: Render
    script:
      actions:
        onRun:
          command: render
          cancelation: {mode: NOTIFY_THEN_TERMINATE, notifyPeriodInSeconds: 120}
