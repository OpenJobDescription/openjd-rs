# `openjd diff` example (multi-line embedded file data): new side, against file_multiline_v1.yaml.
specificationVersion: jobtemplate-2023-09
name: Demo
steps:
  - name: Render
    script:
      actions: {onRun: {command: bash, args: ["{{Task.File.Run}}"]}}
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            set -e
            render --quality high
