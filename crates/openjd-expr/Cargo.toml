serde_json = { workspace = true }

# Ruff Python parser for EXPR extension expression parsing.
# The EXPR language is defined as a subset of Python expression syntax, and the
# spec recommends the ruff parser for Rust implementations. It's the most actively
# maintained Python parser in the Rust ecosystem (daily commits, backed by Astral).
# Published to crates.io by the RustPython project under the `rustpython-` prefix
# (https://github.com/RustPython/RustPython/pull/7532).
# See specs/expr/parser.md for the full evaluation.
#
# These are pinned to an exact version (`=`) on purpose. The ruff crates do not
# follow semver for 0.x patch releases: 0.16.10 replaced `ExprCompare::left` and
# the `comparators` field with `operands`/`runtime_comparators`, which broke any
# build resolving `^0.16.5` without our Cargo.lock (including downstream users and
# cargo-semver-checks in the release-plz workflow). Bump all three together and
# review the upstream AST changes when updating.
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "=0.16.10" }
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "=0.16.10" }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "=0.16.10" }
