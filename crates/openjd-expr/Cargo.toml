[package]
name = "openjd-expr"
version = "0.15.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Open Job Description expression language — types, evaluation, and path mapping"
keywords = ["openjd", "openjobdescription", "expression-language", "parser", "evaluator"]
categories = ["parser-implementations", "template-engine"]

[lints]
workspace = true

[dependencies]
shlex = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
regex-syntax = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Shortest round-trip digits for `format_float`. Rust's own `{}` shortest form
# breaks a tie between two shortest candidates upward (1000000000000000.3 for
# 1000000000000000.25), where CPython's `repr` rounds half to even (.2); ryu
# picks the same digits as `repr`. Already in the tree (through ruff_python_ast).
ryu = { workspace = true }

# Ruff Python parser for EXPR extension expression parsing.
# The EXPR language is defined as a subset of Python expression syntax, and the
# spec recommends the ruff parser for Rust implementations. It's the most actively
# maintained Python parser in the Rust ecosystem (daily commits, backed by Astral).
# These are Astral's own crates, published from astral-sh/ruff. Don't switch to
# the `rustpython-ruff_*` republish: its 0.16.10 adds error hints that make
# error recovery exponential in bracket depth (#489).
# See specs/expr/parser.md for the full evaluation.
#
# These are pinned to an exact version (`=`) on purpose. The ruff crates are
# internal components of Ruff with no semver promise, and a 0.x patch release
# can change the AST (rustpython-ruff 0.16.10 replaced `ExprCompare::left` and
# `comparators` with `operands`), which breaks any build that resolves without
# our Cargo.lock (downstream users, cargo-semver-checks in release-plz). Bump all
# three together, review the upstream AST changes, and keep
# tests/integration/test_parser_work_bound.rs passing when updating.
#
# The `stacker` feature lets the parser grow its stack on deep recursion
# (`-` * 65535 + `1` overflows a 32 MB stack without it). Keep it on.
ruff_python_parser = { version = "=0.0.21", features = ["stacker"] }
ruff_python_ast = "=0.0.21"
ruff_text_size = "=0.0.21"

# NFKC-normalizes non-ASCII identifiers the same way the parser does, so a
# keyword placeholder can be checked against every name the parser will see.
# Not a new dependency: ruff_python_parser already depends on it for the same
# NFKC step. This entry makes it direct, with ruff_python_parser's requirement
# and features, and Cargo.lock gains no package. When bumping the ruff crates
# above, keep this requirement and these features in step with theirs.
unicode-normalization = { version = "0.1.23", default-features = false, features = ["std"] }
